name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Sync environment (Python from .python-version; default groups dev + model)
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Pytest
        run: uv run pytest -q
