[project]
name = "fpl_rocket"
version = "0.1.0"
description = "FPL Rocket: Fantasy Premier League analytics and planning (multi-user, free data only)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "streamlit>=1.66",
    "pulp>=3.3.2",
    "highspy>=1.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# model fitting (GitHub Actions bundle job, backtests, tests); NOT in requirements.txt: the app only reads parquet
model = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[tool.uv]
default-groups = ["dev", "model"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_rocket"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
